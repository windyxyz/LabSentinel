# RA4.2 / ADR-0011：发布流水线——Rust 单二进制正式产物（过渡期结束后的唯一发布形态）。
# verify → test（tests.yml：Rust + Web）→ build-rust（Windows：zip + Inno setup.exe）→ publish（Release）。
# setup.exe 为必发布资产：Inno Setup 7.1.1（官方安装器 + SHA256 钉死）编译
# deploy/windows/installer.iss，源为 Rust staging 树。
# 历史版本的 Python 便携包仍可从旧 tag 的 Release 获取；本流水线不再构建 Python 形态。
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: clean tree / tag == VERSION / CHANGELOG has this release
        run: |
          test -z "$(git status --porcelain)" || { echo "::error::工作区不干净"; git status --short; exit 1; }
          V=$(cat VERSION | tr -d ' \n')
          T="${GITHUB_REF_NAME#v}"
          test "$V" = "$T" || { echo "::error::tag $GITHUB_REF_NAME != VERSION $V"; exit 1; }
          grep -qE "^## \[${V}\]|^## ${V}" CHANGELOG.md || {
            echo "::error::CHANGELOG 缺 ## [$V] 本版条目（发布前把 Unreleased 改名）"; exit 1; }

  test:
    uses: ./.github/workflows/tests.yml

  build-rust:
    needs: [verify, test]
    runs-on: windows-latest
    # 中文日志统一 UTF-8（GBK 控制台 charmap 会炸）
    env:
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # stable
        with:
          toolchain: stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: web build
        working-directory: web
        run: |
          npm ci --registry=https://registry.npmmirror.com
          npm run build
      - name: 准备发行资产（模型/ffmpeg/ffprobe/onnxruntime，哈希校验）
        run: |
          python -m pip install --disable-pip-version-check onnxruntime==1.20.1
          python scripts/prepare_rust_assets.py
      - name: build_rust --strict --zip
        run: python scripts/build_rust.py --strict --zip
      - name: 安装 Inno Setup 7.1.1（setup.exe 为必发布资产；choco 仅有 6.x，故用官方安装器 + 哈希校验）
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP "innosetup-7.1.1-x64.exe"
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe"
          Invoke-WebRequest -Uri $url -OutFile $exe -UseBasicParsing
          $want = "8A5A6711C3766A6E5FB74F280BA0E3551E719CE94538D901FDBD1F8F9920B3F0"
          $got = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($got -ne $want) { throw "Inno 7 安装器哈希不符：$got" }
          Start-Process -FilePath $exe `
            -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=C:\InnoSetup7" -Wait
          "ISCC=C:\InnoSetup7\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          Get-Item C:\InnoSetup7\ISCC.exe | Select-Object FullName
      - name: 编译 setup.exe（ISCC：deploy/windows/installer.iss）
        run: python scripts/build_setup_exe.py
      - name: RA3/RA4 契约冒烟（解包→就绪→backend/版本→前端→停止）
        shell: pwsh
        run: |
          $zip = Get-ChildItem Resources/dist/labsentinel-rust-*.zip |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          python scripts/smoke_rust.py --zip $zip.FullName --timeout 90
      - name: SHA256SUMS（zip + setup.exe）
        shell: pwsh
        run: |
          $zip = Get-ChildItem Resources/dist/labsentinel-rust-*.zip |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $setup = Get-ChildItem Resources/dist/LabSentinel-setup-*.exe |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $sums = "Resources/dist/SHA256SUMS-rust.txt"
          $lines = @($zip, $setup) | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          $lines | Out-File -FilePath $sums -Encoding ascii
          Get-Content $sums
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: labsentinel-rust
          path: |
            Resources/dist/labsentinel-rust-*.zip
            Resources/dist/LabSentinel-setup-*.exe
            Resources/dist/SHA256SUMS-rust.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [build-rust]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806  # v4
        with:
          name: labsentinel-rust
          path: dist
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v2
        with:
          draft: true  # 签名作业接入前保持草稿，人工校验后发布
          files: |
            dist/labsentinel-rust-*.zip
            dist/LabSentinel-setup-*.exe
            dist/SHA256SUMS-rust.txt
