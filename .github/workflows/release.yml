# RA4.2 / ADR-0011：发布流水线——Rust 单二进制正式产物（过渡期结束后的唯一发布形态）。
# verify → test（tests.yml：Rust + Web）→ build-rust（Windows：zip + Inno setup.exe）→ publish（Release）。
# setup.exe 为必发布资产：Inno Setup 7.1.1（官方安装器 + SHA256 钉死）编译
# deploy/windows/installer.iss，源为 Rust staging 树。
# 历史版本的 Python 便携包仍可从旧 tag 的 Release 获取；本流水线不再构建 Python 形态。
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: clean tree / tag == VERSION / CHANGELOG has this release
        run: |
          test -z "$(git status --porcelain)" || { echo "::error::工作区不干净"; git status --short; exit 1; }
          V=$(cat VERSION | tr -d ' \n')
          T="${GITHUB_REF_NAME#v}"
          test "$V" = "$T" || { echo "::error::tag $GITHUB_REF_NAME != VERSION $V"; exit 1; }
          grep -qE "^## \[${V}\]|^## ${V}" CHANGELOG.md || {
            echo "::error::CHANGELOG 缺 ## [$V] 本版条目（发布前把 Unreleased 改名）"; exit 1; }

  test:
    uses: ./.github/workflows/tests.yml

  rust-ci:
    uses: ./.github/workflows/rust.yml

  build-rust:
    needs: [verify, test, rust-ci]
    runs-on: windows-latest
    # 中文日志统一 UTF-8（GBK 控制台 charmap 会炸）
    env:
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # stable
        with:
          toolchain: stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: web build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: 准备发行资产（模型/ffmpeg/ffprobe/onnxruntime/go2rtc，哈希校验）
        run: |
          python -m pip install onnx==1.17.0
          python scripts/prepare_rust_assets.py
      - name: build_rust --strict --zip
        run: python scripts/build_rust.py --strict --zip
      - name: 安装 Inno Setup 7.1.1（setup.exe 为必发布资产；choco 仅有 6.x，故用官方安装器 + 哈希校验）
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP "innosetup-7.1.1-x64.exe"
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe"
          Invoke-WebRequest -Uri $url -OutFile $exe -UseBasicParsing
          $want = "8A5A6711C3766A6E5FB74F280BA0E3551E719CE94538D901FDBD1F8F9920B3F0"
          $got = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($got -ne $want) { throw "Inno 7 安装器哈希不符：$got" }
          Start-Process -FilePath $exe `
            -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=C:\InnoSetup7" -Wait
          "ISCC=C:\InnoSetup7\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          Get-Item C:\InnoSetup7\ISCC.exe | Select-Object FullName
      - name: 编译 setup.exe（ISCC：deploy/windows/installer.iss）
        run: python scripts/build_setup_exe.py
      - name: 安装 Chromium 播放验收依赖
        working-directory: web
        run: npx playwright install chromium --only-shell
      - name: setup.exe 安装→升级→回滚→探活→卸载
        shell: pwsh
        run: |
          $setup = Get-ChildItem Resources/dist/LabSentinel-setup-*.exe |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP ("ls-setup-smoke-" + [Guid]::NewGuid())
          $old = Join-Path $env:RUNNER_TEMP "LabSentinel-setup-0.5.0.exe"
          Invoke-WebRequest -Uri "https://github.com/windyxyz/LabSentinel/releases/download/v0.5.0/LabSentinel-setup-0.5.0.exe" -OutFile $old
          if ((Get-FileHash $old).Hash -ne '3e7472c44798a216641478a5c238a70aa149bd4fbd297d6de15beef72f4ff83b') { throw "旧版安装器校验失败" }
          $installArgs = "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /DIR=`"$dir`""
          $oldInstall = Start-Process -FilePath $old -Wait -PassThru -ArgumentList $installArgs
          if ($oldInstall.ExitCode -ne 0) { throw "旧版安装失败：rc=$($oldInstall.ExitCode)" }
          $p = Start-Process -FilePath $setup.FullName -Wait -PassThru -ArgumentList `
            $installArgs
          if ($p.ExitCode -ne 0) { throw "静默安装失败：rc=$($p.ExitCode)" }
          $want = (Get-Content VERSION -Raw).Trim()
          if ((Get-Content (Join-Path $dir VERSION) -Raw).Trim() -ne $want) { throw "升级版本不正确" }
          $userData = Join-Path $dir 'data\preserve.txt'
          New-Item -ItemType Directory -Path (Split-Path $userData) -Force | Out-Null
          'test-user-state' | Set-Content -LiteralPath $userData
          $legacyData = Join-Path $dir 'server\data\preserve.txt'
          $rv = Start-Process -FilePath (Join-Path $dir 'labsentinel-server.exe') -ArgumentList '--rollback' -WorkingDirectory $dir -Wait -PassThru
          if ($rv.ExitCode -ne 0 -or (Get-Content (Join-Path $dir VERSION) -Raw).Trim() -ne '0.5.0' -or !(Test-Path $userData)) {
            throw "首次覆盖升级后回滚失败：rc=$($rv.ExitCode)"
          }
          $p = Start-Process -FilePath $setup.FullName -Wait -PassThru -ArgumentList $installArgs
          if ($p.ExitCode -ne 0) { throw "重新升级失败：rc=$($p.ExitCode)" }
          foreach ($f in @("labsentinel-server.exe", "VERSION", "web\index.html", "models\yolo11n.onnx", "models\yolo11n_ppe.onnx", "models\yolo11n_ppe.classes.txt", "onnxruntime.dll", "tools\ffmpeg\ffmpeg.exe", "tools\go2rtc.exe", "tools\go2rtc-LICENSE.txt")) {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "安装缺文件：$f" }
          }
          $group = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\LabSentinel"
          if (-not (Test-Path (Join-Path $group "LabSentinel.lnk"))) { throw "缺开始菜单快捷方式" }
          $st = Start-Process -FilePath (Join-Path $dir "labsentinel-server.exe") `
            -ArgumentList "--selftest-http" -WorkingDirectory $dir -Wait -PassThru
          if ($st.ExitCode -ne 0) { throw "安装后 --selftest-http 失败：rc=$($st.ExitCode)" }
          python scripts/smoke_rust.py --install-dir $dir --timeout 90
          if ($LASTEXITCODE -ne 0) { throw "安装版照片或视频检测验收失败" }
          node web/scripts/smoke_webrtc.mjs $dir
          if ($LASTEXITCODE -ne 0) { throw "安装版 RTSP / WebRTC 冒烟失败" }
          New-Item -ItemType Directory -Path (Split-Path $legacyData) -Force | Out-Null
          'legacy-user-state' | Set-Content -LiteralPath $legacyData
          $runKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          New-ItemProperty -Path $runKey -Name LabSentinel -Value ('"' + (Join-Path $dir 'labsentinel-server.exe') + '" --launch --tray') -Force | Out-Null
          $u = Start-Process -FilePath (Join-Path $dir "unins000.exe") -Wait -PassThru `
            -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART"
          if ($u.ExitCode -ne 0) { throw "静默卸载失败：rc=$($u.ExitCode)" }
          Start-Sleep -Seconds 10
          if (Test-Path (Join-Path $dir "labsentinel-server.exe")) { throw "卸载后 exe 残留" }
          if (Test-Path $group) { throw "卸载后开始菜单组残留" }
          $desk = [Environment]::GetFolderPath('Desktop')
          if (Test-Path (Join-Path $desk "LabSentinel.lnk")) { throw "卸载后桌面快捷方式残留" }
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{9C7B3A41-5E2D-4F86-A1C9-2B7D6E4F8A10}_is1"
          if (Test-Path $key) { throw "卸载后注册表卸载项残留" }
          if (Get-ItemProperty -Path $runKey -Name LabSentinel -ErrorAction SilentlyContinue) { throw "卸载后自启项残留" }
          foreach ($name in @('versions', 'server')) {
            if (Test-Path (Join-Path $dir $name)) { throw "卸载后旧目录残留：$name" }
          }
          if (!(Test-Path $userData)) { throw "默认卸载删除了用户数据" }
          if (!(Test-Path (Join-Path $dir 'data\legacy-server-data\preserve.txt'))) { throw "默认卸载丢失旧布局用户数据" }
          $p = Start-Process -FilePath $setup.FullName -Wait -PassThru -ArgumentList $installArgs
          if ($p.ExitCode -ne 0) { throw "保留数据后的重新安装失败：rc=$($p.ExitCode)" }
          $u = Start-Process -FilePath (Join-Path $dir "unins000.exe") -Wait -PassThru `
            -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /REMOVEDATA=1"
          if ($u.ExitCode -ne 0) { throw "删除数据卸载失败：rc=$($u.ExitCode)" }
          Start-Sleep -Seconds 10
          if (Test-Path $dir) { throw "删除数据卸载后安装目录残留" }
          "setup.exe 冒烟通过：安装/探活/升级/回滚/卸载及数据选择"
      - name: 便携包冒烟（启动、前端、照片与视频检测）
        shell: pwsh
        run: |
          $zip = Get-ChildItem Resources/dist/labsentinel-rust-*.zip |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          python scripts/smoke_rust.py --zip $zip.FullName --timeout 90
          if ($LASTEXITCODE -ne 0) { throw "便携包启动冒烟失败" }
          $portable = Join-Path $env:RUNNER_TEMP ("ls-portable-playback-" + [Guid]::NewGuid())
          try {
            Expand-Archive -LiteralPath $zip.FullName -DestinationPath $portable
            node web/scripts/smoke_webrtc.mjs $portable
            if ($LASTEXITCODE -ne 0) { throw "便携版 RTSP / WebRTC 冒烟失败" }
          } finally {
            if (Test-Path -LiteralPath $portable) { Remove-Item -LiteralPath $portable -Recurse -Force }
          }
      - name: SHA256SUMS（zip + setup.exe）
        shell: pwsh
        run: |
          $zip = Get-ChildItem Resources/dist/labsentinel-rust-*.zip |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $setup = Get-ChildItem Resources/dist/LabSentinel-setup-*.exe |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $sums = "Resources/dist/SHA256SUMS-rust.txt"
          $lines = @($zip, $setup) | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          $lines | Out-File -FilePath $sums -Encoding ascii
          Get-Content $sums
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: labsentinel-rust
          path: |
            Resources/dist/labsentinel-rust-*.zip
            Resources/dist/LabSentinel-setup-*.exe
            Resources/dist/SHA256SUMS-rust.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [build-rust]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806  # v4
        with:
          name: labsentinel-rust
          path: dist
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v2
        with:
          draft: true  # 签名作业接入前保持草稿，人工校验后发布
          files: |
            dist/labsentinel-rust-*.zip
            dist/LabSentinel-setup-*.exe
            dist/SHA256SUMS-rust.txt
