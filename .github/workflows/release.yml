# RA4.2 / ADR-0011：发布流水线——Rust 单二进制正式产物（过渡期结束后的唯一发布形态）。
# verify → test → build-rust（隔离 Windows 安装验收）→ sign-windows → publish（草稿）。
# v0.9.6 可手动发布带校验清单的未签名预览版。
# setup.exe 为必发布资产：Inno Setup 7.1.1（官方安装器 + SHA256 钉死）编译
# deploy/windows/installer.iss，源为 Rust staging 树。
# 历史版本的 Python 便携包仍可从旧 tag 的 Release 获取；本流水线不再构建 Python 形态。
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_preview_096:
        description: 发布 v0.9.6 未签名预览版
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: clean tree / tag == VERSION / CHANGELOG has this release
        env:
          PUBLISH_PREVIEW_096: ${{ inputs.publish_preview_096 }}
        run: |
          test -z "$(git status --porcelain)" || { echo "::error::工作区不干净"; git status --short; exit 1; }
          V=$(cat VERSION | tr -d ' \n')
          T="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$V" = "$T" || { echo "::error::tag $GITHUB_REF_NAME != VERSION $V"; exit 1; }
          fi
          if [ "$PUBLISH_PREVIEW_096" = true ]; then
            test "$GITHUB_REF" = refs/heads/main && test "$V" = 0.9.6 || {
              echo "::error::v0.9.6 预览发布要求 main 分支且 VERSION 为 0.9.6"; exit 1; }
          fi
          grep -qE "^## \[${V}\]|^## ${V}" CHANGELOG.md || {
            echo "::error::CHANGELOG 缺 ## [$V] 本版条目（发布前把 Unreleased 改名）"; exit 1; }

  test:
    uses: ./.github/workflows/tests.yml
    with:
      regression: true

  rust-ci:
    uses: ./.github/workflows/rust.yml

  build-rust:
    needs: [verify, test, rust-ci]
    runs-on: windows-latest
    # 中文日志统一 UTF-8（GBK 控制台 charmap 会炸）
    env:
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # stable
        with:
          toolchain: stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: web build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: 准备发行资产（模型/ffmpeg/ffprobe/onnxruntime/go2rtc，哈希校验）
        run: |
          python -m pip install onnx==1.17.0
          python scripts/prepare_rust_assets.py
      - name: build_rust --strict --zip
        run: python scripts/build_rust.py --strict --zip
      - name: 安装 Inno Setup 7.1.1（setup.exe 为必发布资产；choco 仅有 6.x，故用官方安装器 + 哈希校验）
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP "innosetup-7.1.1-x64.exe"
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe"
          Invoke-WebRequest -Uri $url -OutFile $exe -UseBasicParsing
          $want = "8A5A6711C3766A6E5FB74F280BA0E3551E719CE94538D901FDBD1F8F9920B3F0"
          $got = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($got -ne $want) { throw "Inno 7 安装器哈希不符：$got" }
          Start-Process -FilePath $exe `
            -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=C:\InnoSetup7" -Wait
          "ISCC=C:\InnoSetup7\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          Get-Item C:\InnoSetup7\ISCC.exe | Select-Object FullName
      - name: 编译 setup.exe（ISCC：deploy/windows/installer.iss）
        run: python scripts/build_setup_exe.py
      - name: 安装 Chromium 播放验收依赖
        working-directory: web
        run: npx playwright install chromium --only-shell
      - name: setup.exe 全新安装、覆盖、回滚、探活与卸载
        shell: pwsh
        run: |
          $setup = Get-ChildItem Resources/dist/LabSentinel-setup-*.exe |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP ("ls-setup-smoke-" + [Guid]::NewGuid())
          $installArgs = "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /DIR=`"$dir`""
          $p = Start-Process -FilePath $setup.FullName -WindowStyle Hidden -Wait -PassThru -ArgumentList $installArgs
          if ($p.ExitCode -ne 0) { throw "全新安装失败：rc=$($p.ExitCode)" }
          $want = (Get-Content VERSION -Raw).Trim()
          $versionFile = Join-Path $dir 'VERSION'
          if ((Get-Content $versionFile -Raw).Trim() -ne $want) { throw "安装版本不正确" }
          $userData = Join-Path $dir 'data\preserve.txt'
          New-Item -ItemType Directory -Path (Split-Path $userData) -Force | Out-Null
          'test-user-state' | Set-Content -LiteralPath $userData
          $legacyData = Join-Path $dir 'server\data\preserve.txt'

          # Rollback skips archives that have the same version as the active install.
          $fixtureVersion = '0.0.0'
          $index = Join-Path $dir 'web\index.html'
          $freshHash = (Get-FileHash -LiteralPath $index).Hash
          Add-Content -LiteralPath $index '<!-- rollback fixture -->' -Encoding utf8
          $fixtureHash = (Get-FileHash -LiteralPath $index).Hash
          Set-Content -LiteralPath $versionFile -Value $fixtureVersion -Encoding ascii
          $p = Start-Process -FilePath $setup.FullName -WindowStyle Hidden -Wait -PassThru -ArgumentList $installArgs
          if ($p.ExitCode -ne 0 -or (Get-Content $versionFile -Raw).Trim() -ne $want -or
              (Get-FileHash -LiteralPath $index).Hash -ne $freshHash) {
            throw "覆盖安装未恢复候选文件：rc=$($p.ExitCode)"
          }
          $archivedIndex = Join-Path $dir "versions\$fixtureVersion\web\index.html"
          if ((Get-FileHash -LiteralPath $archivedIndex).Hash -ne $fixtureHash) {
            throw "覆盖安装未保留测试归档"
          }
          $rv = Start-Process -FilePath (Join-Path $dir 'labsentinel-server.exe') -ArgumentList '--rollback' -WorkingDirectory $dir -WindowStyle Hidden -Wait -PassThru
          if ($rv.ExitCode -ne 0 -or (Get-Content $versionFile -Raw).Trim() -ne $fixtureVersion -or
              (Get-FileHash -LiteralPath $index).Hash -ne $fixtureHash -or
              (Get-Content -LiteralPath $userData -Raw).Trim() -ne 'test-user-state') {
            throw "归档回滚失败：rc=$($rv.ExitCode)"
          }
          $p = Start-Process -FilePath $setup.FullName -WindowStyle Hidden -Wait -PassThru -ArgumentList $installArgs
          if ($p.ExitCode -ne 0 -or (Get-Content $versionFile -Raw).Trim() -ne $want -or
              (Get-FileHash -LiteralPath $index).Hash -ne $freshHash) {
            throw "重新安装未恢复候选文件：rc=$($p.ExitCode)"
          }
          foreach ($f in @("labsentinel-server.exe", "VERSION", "web\index.html", "models\yolo11n.onnx", "models\yolo11n_ppe.onnx", "models\yolo11n_ppe.classes.txt", "onnxruntime.dll", "tools\ffmpeg\ffmpeg.exe", "tools\go2rtc.exe", "tools\go2rtc-LICENSE.txt")) {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "安装缺文件：$f" }
          }
          $group = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\LabSentinel"
          if (-not (Test-Path (Join-Path $group "LabSentinel.lnk"))) { throw "缺开始菜单快捷方式" }
          $st = Start-Process -FilePath (Join-Path $dir "labsentinel-server.exe") `
            -ArgumentList "--selftest-http" -WorkingDirectory $dir -Wait -PassThru
          if ($st.ExitCode -ne 0) { throw "安装后 --selftest-http 失败：rc=$($st.ExitCode)" }
          python scripts/smoke_rust.py --install-dir $dir --timeout 90
          if ($LASTEXITCODE -ne 0) { throw "安装版照片或视频检测验收失败" }
          node web/scripts/smoke_webrtc.mjs $dir
          if ($LASTEXITCODE -ne 0) { throw "安装版 RTSP / WebRTC 冒烟失败" }
          New-Item -ItemType Directory -Path (Split-Path $legacyData) -Force | Out-Null
          'legacy-user-state' | Set-Content -LiteralPath $legacyData
          $runKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          New-ItemProperty -Path $runKey -Name LabSentinel -Value ('"' + (Join-Path $dir 'labsentinel-server.exe') + '" --launch --tray') -Force | Out-Null
          $u = Start-Process -FilePath (Join-Path $dir "unins000.exe") -Wait -PassThru `
            -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART"
          if ($u.ExitCode -ne 0) { throw "静默卸载失败：rc=$($u.ExitCode)" }
          Start-Sleep -Seconds 10
          if (Test-Path (Join-Path $dir "labsentinel-server.exe")) { throw "卸载后 exe 残留" }
          if (Test-Path $group) { throw "卸载后开始菜单组残留" }
          $desk = [Environment]::GetFolderPath('Desktop')
          if (Test-Path (Join-Path $desk "LabSentinel.lnk")) { throw "卸载后桌面快捷方式残留" }
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{9C7B3A41-5E2D-4F86-A1C9-2B7D6E4F8A10}_is1"
          if (Test-Path $key) { throw "卸载后注册表卸载项残留" }
          if (Get-ItemProperty -Path $runKey -Name LabSentinel -ErrorAction SilentlyContinue) { throw "卸载后自启项残留" }
          foreach ($name in @('versions', 'server')) {
            if (Test-Path (Join-Path $dir $name)) { throw "卸载后旧目录残留：$name" }
          }
          if (!(Test-Path $userData)) { throw "默认卸载删除了用户数据" }
          if (!(Test-Path (Join-Path $dir 'data\legacy-server-data\preserve.txt'))) { throw "默认卸载丢失旧布局用户数据" }
          $p = Start-Process -FilePath $setup.FullName -Wait -PassThru -ArgumentList $installArgs
          if ($p.ExitCode -ne 0) { throw "保留数据后的重新安装失败：rc=$($p.ExitCode)" }
          $u = Start-Process -FilePath (Join-Path $dir "unins000.exe") -Wait -PassThru `
            -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /REMOVEDATA=1"
          if ($u.ExitCode -ne 0) { throw "删除数据卸载失败：rc=$($u.ExitCode)" }
          Start-Sleep -Seconds 10
          if (Test-Path $dir) { throw "删除数据卸载后安装目录残留" }
          "setup.exe 冒烟通过：全新安装、覆盖、回滚、探活与卸载"
      - name: 原生 Windows 服务安装、网页重启、覆盖安装与卸载
        shell: pwsh
        run: |
          $setup = Get-ChildItem Resources/dist/LabSentinel-setup-*.exe | Select-Object -First 1
          $serviceKey = 'HKLM:\SYSTEM\CurrentControlSet\Services\LabSentinel'
          if (Test-Path $serviceKey) { throw 'SCM 冒烟需要无现有 LabSentinel 服务的隔离运行器' }
          function Invoke-Checked([string]$File, [string]$Arguments) {
            $run = Start-Process -FilePath $File -ArgumentList $Arguments -WindowStyle Hidden -Wait -PassThru
            if ($run.ExitCode -ne 0) { throw "$(Split-Path $File -Leaf) 退出码 $($run.ExitCode)" }
          }
          function Wait-Ready([int]$Port) {
            $deadline = (Get-Date).AddSeconds(45)
            while ((Get-Date) -lt $deadline) {
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:$Port/api/health/ready" -TimeoutSec 2
                if ($health.ok -eq $true -or $health.status -eq 'ready') { return }
              } catch { }
              Start-Sleep -Milliseconds 500
            }
            throw "原生服务在端口 $Port 未就绪"
          }
          $quiet = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART'
          $install = "$quiet /ALLUSERS /TASKS=createshortcut,createdesktop,nativewindowsservice"
          $localData = Join-Path $env:LOCALAPPDATA 'LabSentinel'
          if (Test-Path $localData) { throw 'SCM 冒烟需要干净的测试账户数据目录' }
          Invoke-Checked $setup.FullName $install
          $roots = @(${env:ProgramFiles(x86)}, $env:ProgramFiles) | Select-Object -Unique
          $root = $roots | Where-Object { Test-Path (Join-Path $_ 'LabSentinel\labsentinel-server.exe') } |
            Select-Object -First 1 | ForEach-Object { Join-Path $_ 'LabSentinel' }
          if (!$root -or !(Test-Path $serviceKey) -or (Get-Service LabSentinel).Status -ne 'Running') {
            throw 'SCM 注册或运行状态异常'
          }
          Wait-Ready 8000
          $protected = Invoke-WebRequest 'http://127.0.0.1:8000/api/events' -SkipHttpErrorCheck
          if ($protected.StatusCode -ne 401) { throw '未认证请求可读取服务模式事件' }
          $group = Join-Path ([Environment]::GetFolderPath('CommonPrograms')) 'LabSentinel'
          $desktopLink = Join-Path ([Environment]::GetFolderPath('CommonDesktopDirectory')) 'LabSentinel.lnk'
          if (!(Test-Path (Join-Path $group 'LabSentinel.lnk')) -or !(Test-Path $desktopLink)) {
            throw '服务安装未创建公共快捷方式'
          }
          $data = Join-Path $root 'service-data'
          $tokenLine = Get-Content (Join-Path $data 'network.env') | Where-Object { $_ -like 'LS_ADMIN_TOKEN=*' }
          $headers = @{ 'x-admin-token' = ($tokenLine -split '=', 2)[1] }
          $probe = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $probe.Start()
          $port = $probe.LocalEndpoint.Port
          $probe.Stop()
          $network = "http://127.0.0.1:8000/api/system/network"
          Invoke-RestMethod $network -Method Put -Headers $headers -ContentType 'application/json' `
            -Body (@{ port = $port } | ConvertTo-Json) | Out-Null
          Invoke-RestMethod 'http://127.0.0.1:8000/api/system/restart' -Method Post -Headers $headers | Out-Null
          Wait-Ready $port
          New-Item -ItemType Directory -Path $localData | Out-Null
          'personal-state' | Set-Content -LiteralPath (Join-Path $localData 'preserve.txt')
          'native-service-state' | Set-Content -LiteralPath (Join-Path $data 'preserve.txt')
          Invoke-Checked $setup.FullName "$quiet /ALLUSERS"
          Wait-Ready $port
          if (!(Test-Path (Join-Path $root 'versions'))) { throw '原生服务覆盖安装缺版本归档' }
          $uninstaller = Join-Path $root 'unins000.exe'
          Invoke-Checked $uninstaller $quiet
          if (Test-Path $serviceKey) { throw '默认卸载后 SCM 注册残留' }
          if (!(Test-Path (Join-Path $data 'preserve.txt')) -or !(Test-Path (Join-Path $localData 'preserve.txt'))) {
            throw '默认卸载删除了服务数据或个人数据'
          }
          Invoke-Checked $setup.FullName $install
          Wait-Ready $port
          Invoke-Checked $uninstaller "$quiet /REMOVEDATA=1"
          Start-Sleep -Seconds 10
          foreach ($path in @($serviceKey, $root, $localData, $group, $desktopLink)) {
            if (Test-Path $path) { throw "全清卸载后仍有残留：$path" }
          }
      - name: 便携包冒烟（启动、前端、照片与视频检测）
        shell: pwsh
        run: |
          $zip = Get-ChildItem Resources/dist/labsentinel-rust-*.zip |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          python scripts/smoke_rust.py --zip $zip.FullName --timeout 90
          if ($LASTEXITCODE -ne 0) { throw "便携包启动冒烟失败" }
          $portable = Join-Path $env:RUNNER_TEMP ("ls-portable-playback-" + [Guid]::NewGuid())
          try {
            Expand-Archive -LiteralPath $zip.FullName -DestinationPath $portable
            node web/scripts/smoke_webrtc.mjs $portable
            if ($LASTEXITCODE -ne 0) { throw "便携版 RTSP / WebRTC 冒烟失败" }
          } finally {
            if (Test-Path -LiteralPath $portable) { Remove-Item -LiteralPath $portable -Recurse -Force }
          }
      - name: SHA256SUMS（zip + setup.exe）
        shell: pwsh
        run: |
          $zip = Get-ChildItem Resources/dist/labsentinel-rust-*.zip |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $setup = Get-ChildItem Resources/dist/LabSentinel-setup-*.exe |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $sums = "Resources/dist/SHA256SUMS-rust.txt"
          $lines = @($zip, $setup) | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          $lines | Out-File -FilePath $sums -Encoding ascii
          Get-Content $sums
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: labsentinel-windows-acceptance
          path: |
            Resources/dist/labsentinel-rust-*.zip
            Resources/dist/LabSentinel-setup-*.exe
            Resources/dist/SHA256SUMS-rust.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: github.event_name == 'push'
        with:
          name: labsentinel-windows-staging
          path: Resources/dist/rust/labsentinel-server
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  sign-windows:
    needs: [build-rust]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: [self-hosted, Windows, X64, labsentinel-signing]
    environment: release-signing
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806  # v4
        with:
          name: labsentinel-windows-staging
          path: Resources/dist/rust/labsentinel-server
      - name: Sign the executable and installer, then compute release checksums
        shell: pwsh
        env:
          LS_SIGNING_THUMBPRINT: ${{ vars.LS_SIGNING_THUMBPRINT }}
          PYTHONIOENCODING: utf-8
        run: ./scripts/sign_windows_release.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: labsentinel-windows-signed
          path: |
            Resources/dist/labsentinel-rust-*.zip
            Resources/dist/LabSentinel-setup-*.exe
            Resources/dist/SHA256SUMS-rust.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [sign-windows]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806  # v4
        with:
          name: labsentinel-windows-signed
          path: dist
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v2
        with:
          draft: true  # 验收后人工发布
          files: |
            dist/labsentinel-rust-*.zip
            dist/LabSentinel-setup-*.exe
            dist/SHA256SUMS-rust.txt

  publish-preview-096:
    needs: [build-rust]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_preview_096
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806  # v4
        with:
          name: labsentinel-windows-acceptance
          path: dist
      - name: 验证双产物并发布未签名预览版
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: dist
        run: |
          sha256sum --check --strict SHA256SUMS-rust.txt
          gh release create v0.9.6 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title 'LabSentinel v0.9.6 预览版' \
            --notes-file ../docs/releases/release-notes-v0.9.6.md \
            labsentinel-rust-0.9.6-*.zip LabSentinel-setup-0.9.6.exe SHA256SUMS-rust.txt
