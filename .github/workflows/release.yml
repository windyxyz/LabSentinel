# T-402：发布流水线（76 文档 §8.2 目标形态的 Windows 先行版）。
# verify → test-linux → test-win → build-win → package → publish（草稿）。
# sign/provenance 作业占位：Certum 证书与 minisign 密钥属人工事项（77 文档 §五），
# 办妥后在 sign 作业接入 signtool + minisign，再解除 publish 的 draft 手动确认。
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: clean tree / tag == VERSION
        run: |
          git diff --exit-code HEAD --stat || true
          V=$(cat VERSION | tr -d ' \n')
          T="${GITHUB_REF_NAME#v}"
          test "$V" = "$T" || { echo "::error::tag $GITHUB_REF_NAME != VERSION $V"; exit 1; }
          grep -q "## [Unreleased]" CHANGELOG.md || { echo "::error::CHANGELOG 缺本版条目"; exit 1; }

  test-linux:
    uses: ./.github/workflows/tests.yml

  build-win:
    needs: [verify, test-linux]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: web build
        working-directory: web
        run: |
          npm ci --registry=https://registry.npmmirror.com
          npm run build
      - name: portable build（含锁文件全新安装 + 冒烟断言）
        run: python scripts/build_portable.py --zip
      - name: SHA256SUMS
        shell: pwsh
        run: |
          $zip = Get-ChildItem Resources/dist/LabSentinel-portable-*.zip | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($zip.Name)" | Out-File -FilePath Resources/dist/SHA256SUMS.txt -Encoding ascii
          Get-Content Resources/dist/SHA256SUMS.txt
      - name: manifest（干净树来源记录）
        run: |
          python scripts/release_manifest.py
      - uses: actions/upload-artifact@v4
        with:
          name: LabSentinel-portable
          path: |
            Resources/dist/LabSentinel-portable-*.zip
            Resources/dist/SHA256SUMS.txt
            Resources/dist/RELEASE-MANIFEST.json
          if-no-files-found: error
          retention-days: 14
      # sign 占位（T-403）：证书办妥后接入
      #   signtool sign /fd SHA256 /tr <RFC3161> /td SHA256 LabSentinel.exe
      #   minisign -Sm Resources/dist/SHA256SUMS.txt
      # provenance 占位（T-407 后）：actions/attest-build-provenance

  publish:
    needs: [build-win]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LabSentinel-portable
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          draft: true  # 签名作业接入前保持草稿，人工校验后发布
          files: |
            dist/LabSentinel-portable-*.zip
            dist/SHA256SUMS.txt
            dist/RELEASE-MANIFEST.json
