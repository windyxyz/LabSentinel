# T-335：Rust 工作区 CI——双平台 cargo test + clippy -D warnings + fmt
# + cargo-deny（许可证/公告/来源）+ cargo-audit + 交叉编译检查矩阵。
# 契约/向量/单元测试全部离线（ffmpeg 相关测试在缺 ffmpeg 时自动 skip）。
name: rust
on:
  push:
    branches: [main]
    paths: ["engine-rs/**", "proto/**", "testdata/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["engine-rs/**", "proto/**", "testdata/**", ".github/workflows/rust.yml"]
  # security-weekly.yml 每周审计经此处复用——缺 workflow_call 时定时触发
  # 在解析期直接报错（审计从未真正跑过，2026-11-13 一致性审查发现）
  workflow_call: {}

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31  # v2
        with:
          workspaces: engine-rs
      # T-335：sccache 编译缓存（与 rust-cache 叠加，跨 job 复用编译产物）
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39  # sccache
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39  # cargo-nextest
      # R2-505/N-32: --all-features brings the tract AND ort inference paths into
      # CI (ls-analyzer enables both indirectly, but explicit is required so a
      # feature-gated regression cannot hide behind default features).
      - name: cargo nextest run（workspace --all-features：契约/向量/单元）
        working-directory: engine-rs
        run: cargo nextest run --workspace --all-features
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
      - name: clippy -D warnings（手写 crate 零告警；生成代码在 ls-proto 内豁免）
        working-directory: engine-rs
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: fmt check
        working-directory: engine-rs
        run: cargo fmt --all -- --check

  route_coverage:
    # R2-307：路由覆盖报告（Python 运行时退役后仅保留该统计；不再做 Python↔Rust
    # 双向 DB 兼容测试——唯一实现已是 Rust）。
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31  # v2
        with:
          workspaces: engine-rs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: cargo build -p ls-server
        working-directory: engine-rs
        run: cargo build -p ls-server
      - name: route coverage report (R2-307)
        run: |
          python -I scripts/rust_route_coverage.py \
            --exe engine-rs/target/debug/labsentinel-server | tee route-coverage.txt
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/engine-rs/target
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: rust-route-coverage
          path: route-coverage.txt
          retention-days: 30

  audit:
    # T-335：许可证白名单/已知漏洞/yanked/source 单一门禁（Linux 即可，跨平台无关）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39  # cargo-deny
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39  # cargo-audit
      - name: cargo deny check（licenses / advisories / bans / sources）
        working-directory: engine-rs
        run: cargo deny check
      - name: cargo audit（RustSec 公告）
        working-directory: engine-rs
        run: cargo audit

  cross:
    # T-335：交叉编译矩阵——目标只做 check（不链接），GNU Windows 与 Linux 双目标
    # + macOS/ARM Linux 需对应链接器，故以 `cargo check --target` 覆盖语法/依赖可移植性。
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-pc-windows-gnu
          - x86_64-pc-windows-msvc
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31  # v2
        with:
          workspaces: engine-rs
      - name: cargo check --target ${{ matrix.target }}
        working-directory: engine-rs
        # 交叉目标缺系统链接器/openssl，只做前端检查；ls-proto 生成代码在 host 构建
        # （ort 是 load-dynamic 非链接依赖，check 无需 libclang；CARGO_FEATURE_* 是
        # cargo 输出给 build script 的变量，外部设置并不能关闭 feature——原写法无效已删）
        run: cargo check --workspace --target ${{ matrix.target }}
