# 测试工作流（T-004，合并原 ci.yml）：双平台 pytest + ruff 门禁 + pip-audit + 前端构建/审计 + OpenAPI 快照校验。
# 发布/便携包构建走 release.yml（T-402 已重写；旧 portable.yml 已删除）。
# 门禁说明：ruff 先取 E9/F821/PLE（真错误），规则集随 T-509 收紧。
name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_call: {}  # T-402：release.yml 复用本工作流作为发布门禁

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (from hash-pinned lock)
        run: |
          pip install --require-hashes --no-deps -r server/requirements-${{ runner.os == 'Windows' && 'win' || 'linux' }}.lock
          pip install pytest pytest-cov ruff pip-audit
      - name: ruff gate
        run: ruff check server/app scripts tools --select E9,F821,PLE
      - name: pytest
        working-directory: server
        run: python -m pytest tests -q
        env:
          LS_LOG_FILE: "0"
          LS_PPE_MODEL: ""
      - name: pip-audit (fail on high/critical in locked runtime deps)
        run: pip-audit -r server/requirements-${{ runner.os == 'Windows' && 'win' || 'linux' }}.lock --strict

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci + test + build
        working-directory: web
        run: |
          npm ci --registry=https://registry.npmmirror.com
          npm test
          npm run build
      - name: npm audit (production deps)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org

  openapi-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (from hash-pinned lock)
        run: pip install --require-hashes --no-deps -r server/requirements-linux.lock
      - name: export_openapi --check
        run: python scripts/export_openapi.py --check
