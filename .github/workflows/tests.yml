# 测试门禁（RA4.2 / ADR-0011 过渡期结束）：Rust 工作区 + Vue 前端。
# Python 运行时（原 server/）已退役——Python 相关 pytest/ruff/openapi 门禁随之下线；
# tools/ 训练工具链与 scripts/ 验收驱动仍以 Python 编写，属开发工具，不进分发、不参与本门禁。
name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_call: {}  # release.yml 复用本工作流作为发布门禁

permissions:
  contents: read

jobs:
  rust:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # stable
        with:
          toolchain: stable
      - name: cargo test --workspace
        working-directory: engine-rs
        run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci + test + build
        working-directory: web
        run: |
          npm ci --registry=https://registry.npmmirror.com
          npm test
          npm run build
      - name: npm audit (production deps)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
