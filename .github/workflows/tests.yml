# 测试与构建工作流（任务129）：pytest + 前端构建 + OpenAPI 快照校验。
# 便携包构建仍走 portable.yml（需 Windows runner；本工作流在 ubuntu 上跑纯 Python 测试）。
name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: pip install -r server/requirements.txt
      - name: pytest
        working-directory: server
        run: python -m pytest tests -q
        env:
          LS_LOG_FILE: "0"

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci + test + build
        working-directory: web
        run: |
          npm ci --registry=https://registry.npmmirror.com
          npm test
          npm run build

  openapi-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: pip install -r server/requirements.txt
      - name: export_openapi --check
        run: python scripts/export_openapi.py --check
