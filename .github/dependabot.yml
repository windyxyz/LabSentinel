# R2-504/N-33：依赖自动更新（每周；配 .github/workflows 钉 SHA 策略）。
# 2026-11-20：Python 退役（/server 已删）→ pip 段移除；npm/cargo 同样改
# open-pull-requests-limit: 0（仅出安全提醒，不自动开 PR）——breaking 升级
# （如 sha2 0.11 / hmac 0.13 / tonic 0.14）由主线统一评估处理，见第六轮决策
# 「远端只留 main」。
version: 2
updates:
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: cargo
    directory: "/engine-rs"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # force-push 重写历史后 Dependabot 曾自动开升级分支（checkout v7）——
    # 改为只出安全更新提醒、不自动开 PR（open-pull-requests-limit: 0），
    # 版本升级随 release.yml 钉 SHA 策略手动评审。
    open-pull-requests-limit: 0
