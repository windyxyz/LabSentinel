# R2-504/N-33：依赖自动更新（每周；配 .github/workflows 钉 SHA 策略）。
version: 2
updates:
  - package-ecosystem: pip
    directory: "/server"
    schedule:
      interval: weekly
    # 锁文件由 uv pip compile 生成，只更新 requirements.in 触发重锁评审
    allow:
      - dependency-type: "direct"
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: "/engine-rs"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
