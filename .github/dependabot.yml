# R2-504/N-33：依赖自动更新（每周；配 .github/workflows 钉 SHA 策略）。
version: 2
updates:
  - package-ecosystem: pip
    directory: "/server"
    schedule:
      interval: weekly
    # 锁文件由 uv pip compile 生成，只更新 requirements.in 触发重锁评审
    allow:
      - dependency-type: "direct"
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: "/engine-rs"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # force-push 重写历史后 Dependabot 曾自动开升级分支（checkout v7）——
    # 改为只出安全更新提醒、不自动开 PR（open-pull-requests-limit: 0），
    # 版本升级随 release.yml 钉 SHA 策略手动评审。
    open-pull-requests-limit: 0
