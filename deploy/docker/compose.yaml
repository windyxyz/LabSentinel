# T-610：LabSentinel compose（cpu + go2rtc；GPU 变体见 docker-compose.cuda.yaml）
# 用法: docker compose -f deploy/docker/compose.yaml up -d
services:
  labsentinel:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: labsentinel:0.2.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"   # 默认只绑回环（T-101/T-104：对外开放须配令牌+TLS）
    volumes:
      - labsentinel-data:/data
      - ./models:/models:ro
    environment:
      LS_PPE_MODEL: /models/yolo11n_ppe.onnx
      LS_MODEL_FP32: /models/yolo11n.onnx
      # LS_ADMIN_TOKEN: ${LS_ADMIN_TOKEN:?首启令牌必填（Q-02）}
    networks: [lsnet]

  go2rtc:
    image: alexxit/go2rtc:1.9.15
    restart: unless-stopped
    network_mode: "service:labsentinel"  # 共享回环：go2rtc 仅 127.0.0.1:1984 可达
    volumes:
      - go2rtc-config:/config
    depends_on: [labsentinel]
    networks: [lsnet]

volumes:
  labsentinel-data:
  go2rtc-config:

networks:
  lsnet:
