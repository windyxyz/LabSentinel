version: "3.9"
services:
  labsentinel:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/server/data            # 事件库 + 截图 + 视频存证
      - ./models:/app/models:ro            # 模型放宿主机，镜像不带（协议与体积考虑）
    environment:
      - LS_MODEL_FP32=/app/models/yolo11n.onnx
      - LS_BACKEND_ORDER=cpu               # 容器内默认 CPU；GPU 直通后可改 directml
      - LS_WECOM_WEBHOOK=${LS_WECOM_WEBHOOK:-}
      - LS_DINGTALK_WEBHOOK=${LS_DINGTALK_WEBHOOK:-}
      - LS_FEISHU_WEBHOOK=${LS_FEISHU_WEBHOOK:-}
      - LS_SERVERCHAN_SENDKEY=${LS_SERVERCHAN_SENDKEY:-}
      - LS_PUSHPLUS_TOKEN=${LS_PUSHPLUS_TOKEN:-}
      - LS_QMSG_KEY=${LS_QMSG_KEY:-}
      - LS_QMSG_QQ=${LS_QMSG_QQ:-}
      - LS_ALERT_EMAIL_TO=${LS_ALERT_EMAIL_TO:-}
      - LS_SMTP_HOST=${LS_SMTP_HOST:-}
      - LS_SMTP_USER=${LS_SMTP_USER:-}
      - LS_SMTP_PASS=${LS_SMTP_PASS:-}
      # 人脸比对（默认关闭；开启见 README 合规章节，配合下方 --profile face 使用）
      - LS_FACE_ENABLED=${LS_FACE_ENABLED:-false}
      - LS_COMPREFACE_URL=http://compreface-api:8000/api/v1
      - LS_COMPREFACE_API_KEY=${LS_COMPREFACE_API_KEY:-}
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - labsentinel
    restart: unless-stopped

  # ---- CompreFace（人脸比对，可选）----
  # 仅 LS_FACE_ENABLED=true 时需要：docker compose --profile face up -d
  # 注意：以下服务图为按 CompreFace 官方仓库 docker-compose.yml 精简的 best-effort 版本
  #（本机无 Docker 未实测）；若启动异常，请以官方 compose 为准替换本段，
  # 只需保证 compreface-api 的 8000 端口在 compose 网络内可达即可。
  compreface-postgres-db:
    image: postgres:15
    container_name: "compreface-postgres-db"
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=frs
    volumes:
      - ./data/compreface-db:/var/lib/postgresql/data   # 人脸库落盘，便于一键清除
    restart: unless-stopped
    profiles: ["face"]

  compreface-api:
    image: exadel/compreface-api:1.2.0
    container_name: "compreface-api"
    depends_on:
      - compreface-postgres-db
      - compreface-core
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_URL=jdbc:postgresql://compreface-postgres-db:5432/frs
      - SPRING_PROFILES_ACTIVE=dev
      - ENABLE_EMAIL_SERVER=false
      - ADMIN_FIRST_ADMIN_USERNAME=admin
      - ADMIN_FIRST_ADMIN_PASSWORD=admin
    restart: unless-stopped
    profiles: ["face"]

  compreface-core:
    image: exadel/compreface-core:1.2.0-mobilenet
    container_name: "compreface-core"
    environment:
      - ML_PORT=3000
      - UVICORN_NUM_WORKERS=1
    restart: unless-stopped
    profiles: ["face"]

  compreface-fe:
    image: exadel/compreface-fe:1.2.0
    container_name: "compreface-fe"
    ports:
      - "18000:8000"      # CompreFace 管理界面 + API（宿主 18000，避开本服务 8000）
    depends_on:
      - compreface-api
    environment:
      - CLIENT_IP=0.0.0.0
    restart: unless-stopped
    profiles: ["face"]
