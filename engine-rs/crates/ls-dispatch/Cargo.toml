[package]
name = "ls-dispatch"
description = "LabSentinel 告警派发（L2/T-329）：8 渠道 HTTP+邮件等价语义、域名白名单、静默/过滤、每渠道队列+令牌桶+摘要、重试/死信写同一 alert_deliveries"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ls-store = { version = "0.1.0", path = "../ls-store" }
serde = { workspace = true }
serde_json = { workspace = true }
ureq = { version = "2", features = ["tls"] }
hmac = "0.12"
sha2 = "0.10"
# T-329：邮件渠道（纯 Rust rustls 栈，Windows mingw 免 OpenSSL）
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "smtp-transport",
    "rustls-tls",
] }
# T-329：MQTT 事件总线（payload v1 与 Python mqtt_bridge 同语义）
rumqttc = { workspace = true }
# MQTT TLS 系统信任源（rumqttc 0.24 的 Simple 需显式 CA；Rustls 注入用同版本线）
rustls = "0.22"
rustls-native-certs = "0.7"

[dev-dependencies]
tempfile = "3"
hmac = "0.12"
sha2 = "0.10"
