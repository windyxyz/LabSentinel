[package]
name = "ls-dispatch"
description = "LabSentinel 告警派发（L2/T-329）：8 渠道 HTTP+邮件等价语义、域名白名单、静默/过滤、每渠道队列+令牌桶+摘要、重试/死信写同一 alert_deliveries"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ls-store = { version = "0.1.0", path = "../ls-store" }
serde = { workspace = true }
serde_json = { workspace = true }
ureq = { version = "3", features = ["rustls"] }
http = "1"
hmac = "0.12"
sha2 = "0.10"
# T-329：邮件渠道（纯 Rust rustls 栈，Windows mingw 免 OpenSSL）
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "smtp-transport",
    "rustls-tls",
] }
# T-329：MQTT 事件总线（payload v1 与 Python mqtt_bridge 同语义）
rumqttc = { workspace = true }
# MQTT TLS 系统信任源（rumqttc 0.25 → tokio-rustls 0.26 / rustls 0.23；只编 ring，避免 aws-lc 交叉链接）
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"

[dev-dependencies]
tempfile = "3"
hmac = "0.12"
sha2 = "0.10"
