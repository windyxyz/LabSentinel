[package]
publish = false
name = "ls-jobs"
description = "LabSentinel 后台作业（L2/T-330）：数据保留清理、在线热备份（Python backup_data.py 同格式 zip）、未处置升级提醒；与 Python 同库同语义，可独立调度或由 ls-server 托管"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ls-core = { path = "../ls-core" }
ls-store = { path = "../ls-store" }
ls-dispatch = { path = "../ls-dispatch" }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
serde = { workspace = true }
serde_json = { workspace = true }
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = "0.10"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
