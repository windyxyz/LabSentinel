[package]
publish = false
name = "ls-ingest"
description = "LabSentinel 取流：ffmpeg 子进程解码（RTSP/文件通用，rawvideo 管道读帧，T-326）——按 analysis_fps 抽帧、断流指数退避重连"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
ls-core = { path = "../ls-core" }  # R2-301: unified ffmpeg lookup
futures-util = "0.3"
percent-encoding = "2"
retina = "0.4.22"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
url = "2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
# UX 追加：Job Object 孤儿 ffmpeg 治理（winjob.rs FFI 收口）
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects"] }

[lints]
workspace = true
