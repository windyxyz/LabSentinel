[package]
name = "ls-server"
description = "LabSentinel 控制面（L3/T-331）：axum 单二进制 HTTP/WS 服务，路由与 JSON 契约 1:1 对齐 OpenAPI 快照；含鉴权/CSRF/Host/WS 事件广播/静态 SPA"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "labsentinel-server"
path = "src/main.rs"

[dependencies]
ls-store = { version = "0.1.0", path = "../ls-store" }
ls-dispatch = { version = "0.1.0", path = "../ls-dispatch" }
ls-core = { version = "0.1.0", path = "../ls-core" }
ls-jobs = { version = "0.1.0", path = "../ls-jobs" }
# RA1（ADR-0011）：进程内分析 worker——复用 ls-analyzer lib 目标的
# pipeline（Candidate/规则）与 evidence（存证环/encode_mp4）；
# ls-ingest 供 worker 生命周期（Ingest/ChildSlot ffmpeg 托管）
ls-analyzer = { version = "0.1.0", path = "../ls-analyzer" }
ls-ingest = { version = "0.1.0", path = "../ls-ingest" }
axum = { version = "0.7", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
serde = { workspace = true }
serde_json = { workspace = true }
http-body-util = "0.1"
rusqlite = "0.41" # R2-309: stats/quality SQL 参数绑定（bundled 由 ls-store 统一启用）
sha2 = "0.10"     # R2-309: pairing token hash (same as hashlib.sha256)
hmac = "0.12"     # R2-309: media/sign HMAC-SHA256 (same as Python hmac.new)
getrandom = "0.2" # system entropy for pairing tokens
ureq = "3"       # R2-309 批次 3：ppe/download 与 alert-test 真实 HTTP（rustls 0.23）
aes = "0.8"      # 批次 4：Fernet 兼容（AES-128-CBC，与 cryptography 互操作）
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
base64 = "0.22"  # Fernet key/token 编解码
zip = { version = "9", default-features = false, features = ["deflate"] } # RA5：插件 zip 上传解压（>=9 修复 GHSA-q7v9-x93c-xqv3）

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
tempfile = "3"
rusqlite = { version = "0.41", features = ["bundled"] }
