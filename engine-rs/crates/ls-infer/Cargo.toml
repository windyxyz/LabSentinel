[package]
name = "ls-infer"
description = "LabSentinel 推理：YOLO 后处理（decode/NMS 纯 Rust，与 Python 共享检测向量）+ tract 纯 Rust 推理（feature=tract，无需 libclang/ORT 运行时）"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# 纯 Rust ONNX 推理（tract）：覆盖 Conv/SiLU/Concat/Resize/Split 等 YOLO11 算子，
# 不依赖 C++/动态库——windows-gnu 目标可直接构建。
tract = ["dep:tract-onnx"]
# ort 后端（T-325 原定方案；T-328 验收口径）：load-dynamic 运行时加载
# onnxruntime.dll（ORT_DYLIB_PATH），与 Python 同后端 → 黄金语料事件一致率 ≥98%。
# rc.10+ 绑定层为纯 Rust（无 bindgen/libclang）；default-features=false 关闭二进制下载。
ort = ["dep:ort"]

[dependencies]
serde = { workspace = true }
# T-334：model.json 角色声明解析（运行时读取，非测试专用）
serde_json = { workspace = true }
tract-onnx = { version = "0.23", optional = true }
ort = { version = "2.0.0-rc.15", optional = true, default-features = false, features = ["load-dynamic"] }

[dev-dependencies]
serde_json = { workspace = true }

[[example]]
name = "resize_dump"
# yolo 模块（含 cv2 复刻缩放）只在 tract feature 下导出；example 需显式声明，
# 否则单独 `cargo test -p ls-infer`（默认 feature）会编译失败。
required-features = ["tract"]
