[workspace]
resolver = "2"
members = [
    "crates/ls-core",
    "crates/ls-track",
    "crates/ls-proto",
    "crates/ls-analyzer",
    "crates/ls-ingest",
    "crates/ls-infer",
    "crates/ls-store",
    "crates/ls-dispatch",
    "crates/ls-jobs",
    "crates/ls-server",
]

[workspace.package]
version = "0.6.2"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["LabSentinel contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# T-329：MQTT 事件总线（与 Python mqtt_bridge payload v1 同语义）
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider"] }

[workspace.lints.rust]
# UX3/UX4（2026-11-20）：deny + 两个显式 allow 模块收口（wincon.rs 控制台/弹窗
# FFI、tray.rs 托盘消息泵）——每个模块头注释声明 FFI 清单，其余代码保持无 unsafe
unsafe_code = "deny"

[profile.release]
lto = true
codegen-units = 1
