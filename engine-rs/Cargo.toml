[workspace]
resolver = "2"
members = [
    "crates/ls-core",
    "crates/ls-track",
    "crates/ls-proto",
    "crates/ls-analyzer",
    "crates/ls-ingest",
    "crates/ls-infer",
    "crates/ls-store",
    "crates/ls-dispatch",
    "crates/ls-jobs",
    "crates/ls-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["LabSentinel contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# T-329：MQTT 事件总线（与 Python mqtt_bridge payload v1 同语义）
rumqttc = { version = "0.24", default-features = false, features = ["use-rustls"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
codegen-units = 1
